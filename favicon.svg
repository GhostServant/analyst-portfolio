<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a8cc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#00a8cc;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="100" height="100" rx="20" fill="url(#gradLight)"/>
  
  <!-- Основная схема системы -->
  <g transform="translate(20, 20)">
    <!-- Компоненты системы -->
    <rect x="5" y="5" width="20" height="15" rx="3" fill="url(#grad)" opacity="0.9"/>
    <rect x="35" y="5" width="20" height="15" rx="3" fill="url(#grad)" opacity="0.9"/>
    <rect x="20" y="30" width="20" height="15" rx="3" fill="url(#grad)" opacity="0.9"/>
    
    <!-- Соединительные линии -->
    <path d="M25 20 L25 30" stroke="url(#grad)" stroke-width="3" fill="none"/>
    <path d="M45 12.5 L40 12.5" stroke="url(#grad)" stroke-width="3" fill="none"/>
    <path d="M40 12.5 L40 30" stroke="url(#grad)" stroke-width="3" fill="none"/>
    
    <!-- Точки соединения -->
    <circle cx="25" cy="20" r="2" fill="url(#grad)"/>
    <circle cx="45" cy="12.5" r="2" fill="url(#grad)"/>
    <circle cx="40" cy="12.5" r="2" fill="url(#grad)"/>
    <circle cx="40" cy="30" r="2" fill="url(#grad)"/>
  </g>
  
  <!-- Декоративные элементы -->
  <circle cx="15" cy="15" r="2" fill="url(#grad)" opacity="0.4"/>
  <circle cx="85" cy="15" r="2" fill="url(#grad)" opacity="0.4"/>
  <circle cx="15" cy="85" r="2" fill="url(#grad)" opacity="0.4"/>
  <circle cx="85" cy="85" r="2" fill="url(#grad)" opacity="0.4"/>
</svg>